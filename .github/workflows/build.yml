name: Build GTA SGNT RJ Universal 1.0.0
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK 26.2
        run: sdkmanager "ndk;26.2.11394342" "cmake;3.22.1"
      - name: Gradle permissions
        run: chmod +x gradlew
      - name: Build universal APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify ARM32 + ARM64
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libGTASA.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libGTASA.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libsamp.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsamp.so'
          cp "$APK" GTA_SGNT_RJ_1.0.0_UNIVERSAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-SGNT-RJ-1.0.0-UNIVERSAL
          path: GTA_SGNT_RJ_1.0.0_UNIVERSAL.apk
